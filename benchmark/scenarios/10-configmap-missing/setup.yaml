apiVersion: v1
kind: Namespace
metadata:
  name: bench-configmap
  labels:
    benchmark: "true"
---
# NOTE: The ConfigMap "app-config" and Secret "app-secrets" are intentionally
# NOT created here — their absence is the bug being diagnosed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configmap-app
  namespace: bench-configmap
  labels:
    app: configmap-app
    benchmark: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: configmap-app
  template:
    metadata:
      labels:
        app: configmap-app
        benchmark: "true"
    spec:
      initContainers:
        - name: init-config-reader
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Reading app secrets from /secrets..."
              cat /secrets/db-password
              echo "Init complete."
          volumeMounts:
            - name: secrets-volume
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
      containers:
        - name: app-container
          image: nginx:1.25
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: app-config
          volumeMounts:
            - name: config-volume
              mountPath: /etc/app/config
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: config-volume
          configMap:
            name: app-config
        - name: secrets-volume
          secret:
            secretName: app-secrets
