apiVersion: v1
kind: Namespace
metadata:
  name: bench-pending
  labels:
    benchmark: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-app
  namespace: bench-pending
  labels:
    app: pending-app
    benchmark: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pending-app
  template:
    metadata:
      labels:
        app: pending-app
        benchmark: "true"
    spec:
      containers:
        - name: app-container
          image: nginx:1.25
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100"
              memory: "128Mi"
            limits:
              cpu: "100"
              memory: "256Mi"
