apiVersion: v1
kind: Namespace
metadata:
  name: bench-quota
  labels:
    benchmark: "true"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tight-quota
  namespace: bench-quota
  labels:
    benchmark: "true"
spec:
  hard:
    requests.memory: "100Mi"
    limits.memory: "200Mi"
    pods: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-busting-app
  namespace: bench-quota
  labels:
    app: quota-busting-app
    benchmark: "true"
spec:
  replicas: 5
  selector:
    matchLabels:
      app: quota-busting-app
  template:
    metadata:
      labels:
        app: quota-busting-app
        benchmark: "true"
    spec:
      containers:
        - name: app-container
          image: nginx:1.25
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "50Mi"
            limits:
              cpu: "100m"
              memory: "100Mi"
