apiVersion: v1
kind: Namespace
metadata:
  name: bench-probes
  labels:
    benchmark: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-no-probes
  namespace: bench-probes
  labels:
    app: nginx-no-probes
    benchmark: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-no-probes
  template:
    metadata:
      labels:
        app: nginx-no-probes
        benchmark: "true"
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          # No readinessProbe defined
          # No livenessProbe defined
          # No resource requests or limits defined
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  namespace: bench-probes
  labels:
    benchmark: "true"
spec:
  selector:
    app: nginx-no-probes
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-hpa
  namespace: bench-probes
  labels:
    benchmark: "true"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-no-probes
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
